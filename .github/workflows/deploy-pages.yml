name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set build metadata
        run: |
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "GIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter Web (prefer HTML renderer)
        run: |
          # Try modern flags first; fall back to dart-define for older Flutter
          (flutter build web --release --base-href "/thodw_app/" --web-renderer html --pwa-strategy=none \
            --dart-define=BUILD_TIME=${BUILD_TIME} --dart-define=GIT_SHA=${GIT_SHA} \
            --dart-define=THODW_PROVISIONER_URL=https://thodw-auth-provisioner.aqxdivelog.workers.dev) || \
          (flutter build web --release --base-href "/thodw_app/" --dart-define=FLUTTER_WEB_USE_SKIA=false \
            --dart-define=BUILD_TIME=${BUILD_TIME} --dart-define=GIT_SHA=${GIT_SHA} \
            --dart-define=THODW_PROVISIONER_URL=https://thodw-auth-provisioner.aqxdivelog.workers.dev)
          # Disable service worker for older iPad/Safari compatibility
          rm -f build/web/flutter_service_worker.js || true
          sed -i 's/serviceWorkerSettings:\s*{[^}]*}/serviceWorkerSettings: null/g' build/web/flutter_bootstrap.js || true
          cat > build/web/build-info.json <<EOF
          {"git_sha":"${GIT_SHA}","build_time":"${BUILD_TIME}"}
          EOF
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('build/web')
          git_sha = os.environ['GIT_SHA']

          bootstrap = root / 'flutter_bootstrap.js'
          text = bootstrap.read_text(encoding='utf-8')
          text = text.replace('"mainJsPath":"main.dart.js"', f'"mainJsPath":"main.dart.js?v={git_sha}"')
          bootstrap.write_text(text, encoding='utf-8')

          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          loader = f'''  <script>
            (function() {{
              var fallbackSha = "{git_sha}";
              var storageKey = 'thodw_build_sha';

              function loadApp(sha) {{
                var script = document.createElement('script');
                script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(sha || fallbackSha);
                script.async = true;
                document.body.appendChild(script);
              }}

              function reloadForNewBuild(sha) {{
                try {{
                  localStorage.setItem(storageKey, sha);
                }} catch (_) {{}}

                var done = function() {{
                  var url = new URL(window.location.href);
                  url.searchParams.set('v', sha);
                  window.location.replace(url.toString());
                }};

                if ('caches' in window) {{
                  caches.keys().then(function(keys) {{
                    return Promise.all(keys.map(function(key) {{ return caches.delete(key); }}));
                  }}).finally(done);
                  return;
                }}

                done();
              }}

              function start(infoSha) {{
                var sha = infoSha || fallbackSha;
                var previous = null;
                try {{
                  previous = localStorage.getItem(storageKey);
                }} catch (_) {{}}

                if (previous && previous !== sha) {{
                  reloadForNewBuild(sha);
                  return;
                }}

                try {{
                  localStorage.setItem(storageKey, sha);
                }} catch (_) {{}}
                loadApp(sha);
              }}

              fetch('build-info.json?v=' + Date.now(), {{ cache: 'no-store' }})
                .then(function(response) {{ return response.json(); }})
                .then(function(info) {{ start(info.git_sha); }})
                .catch(function() {{ start(fallbackSha); }});
            }})();
          </script>'''
          html = html.replace('<script src="flutter_bootstrap.js" async></script>', loader)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
