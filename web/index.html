<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
  >
  <meta name="description" content="A new Flutter project.">
  
  <!-- Force HTML renderer to improve iPad (Desktop Website UA) compatibility -->
  <meta name="flutter-web-renderer" content="html">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f8f6fa;
      overscroll-behavior-y: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host {
      background: #f8f6fa;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="thodw_aqx">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>thodw_aqx</title>
  <link rel="manifest" href="manifest.json?v=3">
</head>
<body>
  <!-- Aggressively unregister any existing service workers to avoid stale caches -->
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(function(regs){
            regs.forEach(function(reg){ reg.unregister(); });
          });
        } catch (_) { /* ignore */ }
      }
    })();
  </script>
  <script>
    (function() {
      function syncViewportHeight() {
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.height = height + 'px';
        document.body.style.height = height + 'px';
      }

      syncViewportHeight();
      window.addEventListener('resize', syncViewportHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(syncViewportHeight, 60);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight);
        window.visualViewport.addEventListener('scroll', syncViewportHeight);
      }

      document.addEventListener('focusout', function() {
        setTimeout(syncViewportHeight, 160);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
